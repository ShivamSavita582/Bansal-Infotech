<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto Hover Hexagons</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f9f9f9;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 600px;
    }

    .hex {
      width: 120px;
      height: 120px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.5s ease, transform 0.5s ease, color 0.5s ease;
    }

    /* hover + active दोनों पर same effect */
    .hex:hover,
    .hex.active {
      background: #3498db;
      color: #fff;
      transform: scale(1.1);
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
    }
  </style>
</head>
